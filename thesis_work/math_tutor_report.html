<title>Math Tutor Build</title>
<style>
:root {
  --bg: #f7f7f5; --card: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --border: #e2e2de;

  --bar: #9db8ec; --bar2: #f0b78a; --code: #f1f1ee; --mark: #fff1a8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --card: #1d1d20; --fg: #ececee; --muted: #9a9aa2; --border: #2e2e33;
    --accent: #7aa7ff; --accent-soft: #1f2b45; --good: #5cc28a; --bad: #ff7b6b; --warn: #e3b25a;
    --bar: #3d5f9e; --bar2: #9a6a45; --code: #26262a; --mark: #5a4f12;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --card: #1d1d20; --fg: #ececee; --muted: #9a9aa2; --border: #2e2e33;
  --accent: #7aa7ff; --accent-soft: #1f2b45; --good: #5cc28a; --bad: #ff7b6b; --warn: #e3b25a;
  --bar: #3d5f9e; --bar2: #9a6a45; --code: #26262a; --mark: #5a4f12;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 26px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0; }
.chip { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.chip b { display: block; font-size: 22px; }
.chip span { color: var(--muted); font-size: 13px; }
details.step { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin: 12px 0; }
details.step > summary { cursor: pointer; padding: 14px 16px; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
details.step > summary::-webkit-details-marker { display: none; }
details.step > summary::before { content: "▸"; color: var(--muted); }
details.step[open] > summary::before { content: "▾"; }
details.step > summary .num { color: var(--accent); }
details.step > summary .key { color: var(--muted); font-weight: 400; font-size: 14px; }
.body { padding: 0 16px 16px; }
details.sub { border-top: 1px solid var(--border); padding: 8px 0; }
details.sub > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.tldr { margin: 4px 0 10px; padding-left: 18px; }
.tldr li { margin: 2px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 8px 0; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
pre, code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
pre { background: var(--code); border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
.bars { margin: 8px 0; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 28%) 1fr 70px; gap: 8px; align-items: center; margin: 3px 0; font-size: 13px; }
.bar-row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { background: var(--code); border-radius: 4px; height: 16px; position: relative; overflow: hidden; }
.bar-fill { background: var(--bar); height: 100%; border-radius: 4px; }
.bar-fill.alt { background: var(--bar2); }
.bar-row .value { text-align: right; font-variant-numeric: tabular-nums; }
.cap-line { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--bad); }
.funnel .bar-row { grid-template-columns: minmax(110px, 26%) 1fr 160px; }
.drop { color: var(--bad); font-size: 12px; }
.tag { display: inline-block; padding: 0 6px; border-radius: 5px; font-size: 12px; background: var(--accent-soft); color: var(--accent); margin-right: 4px; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
textarea { width: 100%; min-height: 70px; background: var(--code); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font: inherit; }
.tokens span { display: inline-block; padding: 1px 4px; margin: 1px; border-radius: 4px; background: var(--code); font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.tokens span.hit { background: var(--mark); }
.tokens span.ph { color: var(--accent); font-weight: 700; }
.score { font-size: 20px; font-weight: 700; }
.note { color: var(--muted); font-size: 13px; }
.pipeline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.pipeline .node { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
.pipeline .arrow { color: var(--muted); }
.theme { float: right; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
</style>
</head>

swer: 17;", "executed_answer": 17, "teacher_correct": true}, {"student_sees": "Problem: Ravi is setting up a fish tank in his bedroom, and the pet shop has neon tetras for $2 each. He chooses 6 of them. The little fish shimmer blue under the lamp. What does Ravi pay for his new fish?\nAnswer: 12\nFollow-up: He also buys a tub of fish food for $5. How much has he spent now?\nAnswer: 17\nFollow-up: Ravi had saved $30 for his tank. How much of his savings is left?\n\n", "teacher_writes": "17 + 0 = 17\n30 - 17 = 13\nAnswer: 13;", "executed_answer": 13, "teacher_correct": true}, {"student_sees": "Problem: Ravi is setting up a fish tank in his bedroom, and the pet shop has neon tetras for $2 each. He chooses 6 of them. The little fish shimmer blue under the lamp. What does Ravi pay for his new fish?\nAnswer: 12\nFollow-up: He also buys a tub of fish food for $5. How much has he spent now?\nAnswer: 17\nFollow-up: Ravi had saved $30 for his tank. How much of his savings is left?\nAnswer: 13\nFollow-up: A week later he goes back and buys 4 more neon tetras at the same price. How much money does he have left after that?\n\n", "teacher_writes": "13 - 4 = 9\n9 - 2 = 7\nAnswer: 7;", "executed_answer": 5, "teacher_correct": false}]}, {"id": "S09-mem-b02-0031~w1", "source": "reword:S09-mem-b02-0031", "turns": [{"student_sees": "Problem: Halima buys 6 daisy plants for her new flower bed, at $2 a plant. Bees are already buzzing around the garden centre. What do the daisies cost her?\n\n", "teacher_writes": "6 * 2 = 12\nAnswer: 12;", "executed_answer": 12, "teacher_correct": true}, {"student_sees": "Problem: Halima buys 6 daisy plants for her new flower bed, at $2 a plant. Bees are already buzzing around the garden centre. What do the daisies cost her?\nAnswer: 12\nFollow-up: She also buys a bag of compost for $5. How much has she spent now?\n\n", "teacher_writes": "12 + 5 = 17\nAnswer: 17;", "executed_answer": 17, "teacher_correct": true}, {"student_sees": "Problem: Halima buys 6 daisy plants for her new flower bed, at $2 a plant. Bees are already buzzing around the garden centre. What do the daisies cost her?\nAnswer: 12\nFollow-up: She also buys a bag of compost for $5. How much has she spent now?\nAnswer: 17\nFollow-up: Halima had saved $30 for the garden. How much of her savings is left?\n\n", "teacher_writes": "17 + 13 = 30\n30 - 17 = 13\nAnswer: 13;", "executed_answer": 13, "teacher_correct": true}, {"student_sees": "Problem: Halima buys 6 daisy plants for her new flower bed, at $2 a plant. Bees are already buzzing around the garden centre. What do the daisies cost her?\nAnswer: 12\nFollow-up: She also buys a bag of compost for $5. How much has she spent now?\nAnswer: 17\nFollow-up: Halima had saved $30 for the garden. How much of her savings is left?\nAnswer: 13\nFollow-up: The next week she buys 4 more daisy plants at the same price. How much money does she have left then?\n\n", "teacher_writes": "13 - 4 = 9\n9 - 8 = 1\nAnswer: 1;", "executed_answer": 5, "teacher_correct": false}]}, {"id": "S09-mem-b02-0031~n1", "source": "memory", "turns": [{"student_sees": "Problem: Ravi is setting up a fish tank in his bedroom, and the pet shop has neon tetras for $2 each. He chooses 6 of them. The little fish shimmer blue under the lamp. What does Ravi pay for his new fish?\n\n", "teacher_writes": "2 * 6 = 12\nAnswer: 12;", "executed_answer": 12, "teacher_correct": true}, {"student_sees": "Problem: Ravi is setting up a fish tank in his bedroom, and the pet shop has neon tetras for $2 each. He chooses 6 of them. The little fish shimmer blue under the lamp. What does Ravi pay for his new fish?\nAnswer: 12\nFollow-up: He also buys a tub of fish food for $5. How much has he spent now?\n\n", "teacher_writes": "2 * 6 = 12\n12 + 5 = 17\nAnswer: 17;", "executed_answer": 17, "teacher_correct": true}, {"student_sees": "Problem: Ravi is setting up a fish tank in his bedroom, and the pet shop has neon tetras for $2 each. He chooses 6 of them. The little fish shimmer blue under the lamp. What does Ravi pay for his new fish?\nAnswer: 12\nFollow-up: He also buys a tub of fish food for $5. How much has he spent now?\nAnswer: 17\nFollow-up: Ravi had saved $48 for his tank. How much of his savings is left?\n\n", "teacher_writes": "17 + 0 = 17\n48 - 17 = 31\nAnswer: 31;", "executed_answer": 31, "teacher_correct": true}, {"student_sees": "Problem: Ravi is setting up a fish tank in his bedroom, and the pet shop has neon tetras for $2 each. He chooses 6 of them. The little fish shimmer blue under the lamp. What does Ravi pay for his new fish?\nAnswer: 12\nFollow-up: He also buys a tub of fish food for $5. How much has he spent now?\nAnswer: 17\nFollow-up: Ravi had saved $48 for his tank. How much of his savings is left?\nAnswer: 31\nFollow-up: A week later he goes back and buys 11 more neon tetras at the same price. How much money does he have left after that?\n\n", "teacher_writes": "11 * 2 = 22\n31 - 22 = 9\nAnswer: 9;", "executed_answer": 9, "teacher_correct": true}]}], "prompts": {"working": "Solve the maths word problem. If there are follow-up questions, answer only the last one; earlier answers are given and correct.\nWrite each calculation on its own line as: number operator number = result, using only + - * /. Then write the last line as Answer: followed by the number and a semicolon, for example:\n6 * 4 = 24\n24 - 9 = 15\nAnswer: 15;\nThe semicolon is required. No words, no units, nothing after the semicolon.\n\n{text}", "answer": "Solve the maths word problem. If there are follow-up questions, answer only the last one; earlier answers are given and correct.\nReply with exactly one line: Answer: followed by the number and a semicolon, for example:\nAnswer: 15;\nThe semicolon is required. No working, no words, no units.\n\n{text}"}, "example_responses": ["Answer: 1234567890;", "24 - 9 = 15\nAnswer: 15;", "12 + 7 = 19\nAnswer: 19;", "3 * 24 = 72\n72 - 35 = 37\nAnswer: 37;", "56 / 7 = 8\nAnswer: 8;", "45 + 8 = 53\n53 - 1 = 52\n52 / 8 = 6\nAnswer: 6;", "35-23=12\n4*6=24\n8/2=4\n3+4=7\nAnswer: 7;"], "methods": [{"q": "What is the corpus, and what is it for?", "a": "\n<ul><li>Training data for the <b>math tutor<\/b>: a small student model distilled from Gemma 4 12B that answers grade 2-4\narithmetic word problems and follow-up questions, inside a harness that keeps the conversation state (agent = model + harness).<\/li>\n<li>One <b>item<\/b> = a word problem, a Python <code>solve()<\/code> that computes its answer, and 0-3 follow-up questions,\neach with a <code>solve(state)<\/code> continuing from the previous turn. An item with k follow-ups gives k+1 training turns.<\/li>\n<li>The answer is always what the code returns; no answer was ever typed by a person or a model.<\/li><\/ul>"}, {"q": "Where do the problems come from?", "a": "\n<ol><li><b>Human test (never trained on):<\/b> SVAMP, 746 of 1,000 problems inside the range.<\/li>\n<li><b>Human seeds:<\/b> ASDiv 1,067 + MAWPS 243\n+ harvested open-licence school problems 843 = 2,153 seeds, after dedup.<\/li>\n<li><b>Written by Claude agents:<\/b> 12,476 items: <i>memory<\/i> writers (10 slices × 8 batches × 100) and\n<i>seeded<\/i> writers (each seed rewritten twice into a new story with the same operations), plus a 150-item pilot and 20 hand-written items.<\/li>\n<li><b>Reworded:<\/b> 21,694 rewordings of train items so far (two per item; text only, the code is reused).<\/li>\n<li><b>Renumbered:<\/b> copies with new numbers, made by a script, re-checked by execution.<\/li><\/ol>\nKept after pruning by source: reword 21,530, memory 8,049, seeded 4,355, online 48, hand 20."}, {"q": "Which models did what?", "a": "\n<ul><li><b>Claude Opus 5.5<\/b> (Claude Code): designed the pipeline, wrote the code, orchestrated the agents, and wrote all\nitems of writing runs A-D and the rewordings (as sub-agents).<\/li>\n<li><b>Claude Sonnet 5.5<\/b>: the 150-item writing pilot only.<\/li>\n<li><b>Gemma 4 12B instruct<\/b> (google/gemma-4-12B-it): the teacher. It never writes items; it answers them, and its outputs and\nlogits are what the student is distilled from.<\/li>\n<li>Same division of labour as TinyGSM (arXiv 2312.09241): a large model writes problems with Python solutions, a smaller one is trained on them.<\/li><\/ul>"}, {"q": "What exactly were the writing agents told?", "a": "\n<ul><li>The full brief is in the repository: <code>library/domain/math_tutor/writer_brief.md<\/code> (item format, code rules,\nslice table, variety rules, the three sources, rewording rules).<\/li>\n<li>Each writer also got an assignment: its slice, 100 items, an exact mix (unknown position, grade, distractor type,\nfollow-up count), 12-15 contexts of its own (out of 80) and one style emphasis (out of 8), so batches of the same slice\ndo not converge.<\/li>\n<li>Seeded writers got 100 seed lines (read by line number, checked) and wrote one new item per seed with the same\noperations in the same order.<\/li>\n<li>Every writer ran the validator on its own file and fixed failures before finishing.<\/li><\/ul>"}, {"q": "How is each answer guaranteed to be right?", "a": "\n<ul><li><code>solve()<\/code> is never executed by Python. A ~60-line interpreter walks its syntax tree and allows only\nassignments, + − × // %, whole-number literals, <code>state['name']<\/code> and one returned dict.<\/li>\n<li>Every intermediate value must be a whole number 0-999; division must be exact except in the remainder slice (S07).<\/li>\n<li>Every number in the code must appear in that turn's text; unused digit numbers must match the distractor label;\nfollow-ups must read the previous state.<\/li>\n<li>26 deliberately broken items, one per rule, are all rejected (<code>validator_cases.py<\/code>).<\/li>\n<li>The validator cannot check that the story means what the code computes. That was spot-checked by hand (10 random\nitems, all correct) and is checked at scale by the teacher: items where Gemma's answer disagrees are flagged\n(<code>answer_correct<\/code>), and every disagreement checked so far was Gemma's error.<\/li><\/ul>"}, {"q": "How was the human test kept out of training?", "a": "\n<ul><li>SVAMP is test only: never trained on, never shown to a writer.<\/li>\n<li>Seeds within word-sequence ratio 0.8 or trigram Jaccard 0.5 of any SVAMP problem were dropped\n(89); SVAMP was built from ASDiv, so this removes its sources.<\/li>\n<li>Harvesters were barred from the 11 websites ASDiv was scraped from and from every copy of SVAMP / ASDiv / MAWPS / GSM8K.<\/li>\n<li>Every written item went through the same test-leak check (stage 5).<\/li>\n<li>Synthetic test and held-out splits are assigned by <i>family<\/i>: rewordings and renumberings of a test item stay in test.<\/li><\/ul>"}, {"q": "How were duplicates and near-duplicates removed?", "a": "\n<ol><li><b>Normalise:<\/b> lowercase, punctuation out, numbers (digits or words) → N, names → NAME.<\/li>\n<li><b>Exact:<\/b> identical normalised text → drop the later one.<\/li>\n<li><b>Near:<\/b> word-sequence ratio (2 × words matching in order / all words, difflib) above 0.8 → drop. One word swapped in\na 17-word problem scores 0.94; the same words reordered ~0.4 and survive (reordering is real variety).\nWord-trigram Jaccard was tried first and replaced after the pilot: it let a one-word swap through (0.68).<\/li>\n<li>Candidates are found through each problem's rarest words (prefix filtering); this is exact, it matched brute force on all seeds.<\/li><\/ol>\nStages on the current build: <ul><li>execute: 34,170 → 34,170<\/li><li>normalise: 34,170 → 34,170<\/li><li>exact: 34,170 → 34,163 (exact duplicate 7)<\/li><li>near-dup: 34,163 → 34,002 (near-duplicate 161)<\/li><li>test leak: 34,002 → 34,002<\/li><li>shape cap: 34,002 → 34,002<\/li><\/ul>"}, {"q": "How was variety and structural balance ensured?", "a": "\n<ul><li>10 slices from the standard word-problem taxonomy (change join/separate, combine, compare, equal groups, partitive\nand quotative division, multiplicative compare, rates/money, multi-step), 8 batches each, each batch with its own contexts and style.<\/li>\n<li>Shape cap: within a slice no full operation sequence above 25% of the slice; the most redundant go first. Changed after the\npilot from a global 8% cap, which would have cut most one-step subtraction (four slices share it; SVAMP is 77% one-step).<\/li>\n<li>Result (templateness, nearest-neighbour word-sequence ratio in a 2,000-problem sample, median): our items\n0.4, human seeds 0.542,\nSVAMP 0.912, v1 template corpus 1.0.<\/li><\/ul>"}, {"q": "What are the splits?", "a": "\n<ul><li>Items: train 32,377, test 1,210, heldout_shape 415.<\/li>\n<li><b>test<\/b>: 10% of families per slice, random (seed 0). <b>heldout_shape<\/b>: every item whose problem is\n<code>add>mul<\/code>, <code>sub>div<\/code> or <code>sub>add<\/code>, never trained on, while their parts and reverse orders are\n(compositional test). <b>SVAMP<\/b>: the human test, single turn.<\/li>\n<li>Only train items are reworded; renumbered copies keep their item's split.<\/li><\/ul>"}, {"q": "How were rewordings and renumbered copies made?", "a": "\n<ul><li><b>Rewording:<\/b> an Opus agent writes only new text for the problem and each follow-up question; the original\n<code>solve()<\/code> code is reused, so the maths cannot change. The full validator runs on the result, and the agent's\nself-check rejects a rewording more than 0.8 similar to its original or its sibling (the same rule pruning applies).<\/li>\n<li><b>Renumbering:<\/b> each number the code uses (and each digit distractor) gets a new value between half and double the\nold one; text and code change together in every turn; the copy is kept only if it passes the full validator.\nLast build: 34,002 items → 96,544 copies.<\/li><\/ul>"}, {"q": "What went wrong, and what changed because of it?", "a": "\n<ul><li><b>Online writers<\/b> (pilot) found usable text on 1 of 11 pages and credited loosely related URLs → replaced by\nharvesters that copy real problems word for word with URL and licence.<\/li>\n<li><b>Near-duplicate measure<\/b> trigram Jaccard → word-sequence ratio (one-word swaps slipped through).<\/li>\n<li><b>Shape cap<\/b> global 8% → 25% within a slice.<\/li>\n<li><b>Prose number words<\/b> (\"the two classes\") counted as unused numbers → only digit numbers count; distractors are written in digits.<\/li>\n<li><b>Usage limits<\/b> stopped runs A, B, C, D and the first reword run. Each writer creates one file and never overwrites;\nafter each stop the files were inventoried, committed and only missing tasks re-run (two half-written reword files were\nkept and their remaining items written to new files).<\/li>\n<li><b>Teacher format:<\/b> Gemma left out the final \";\" and sometimes wrote 35-23=12 without spaces → the prompt shows an\nexample ending in \";\", and the vocabulary accepts the no-space forms.<\/li><\/ul>"}, {"q": "What did writing cost?", "a": "\n<div class=\"scroll\"><table><thead><tr><th>run<\/th><th>date<\/th><th>model<\/th><th class=\"n\">agents<\/th><th class=\"n\">tokens<\/th>\n<th class=\"n\">minutes<\/th><th>ended by<\/th><\/tr><\/thead><tbody><tr><td>pilot<\/td><td>2026-10-04<\/td><td>Claude Sonnet 5.5<\/td><td class='n'>3<\/td><td class='n'>286,554<\/td><td class='n'>5.3<\/td><td>finished<\/td><\/tr><tr><td>A<\/td><td>2026-10-04<\/td><td>Claude Opus 5.5<\/td><td class='n'>84<\/td><td class='n'>5,448,457<\/td><td class='n'>43.7<\/td><td>session usage limit<\/td><\/tr><tr><td>B<\/td><td>2026-10-04<\/td><td>Claude Opus 5.5<\/td><td class='n'>28<\/td><td class='n'>1,405,564<\/td><td class='n'>17.5<\/td><td>session usage limit (shared with run A)<\/td><\/tr><tr><td>C<\/td><td>2026-10-04<\/td><td>Claude Opus 5.5<\/td><td class='n'>72<\/td><td class='n'>7,484,311<\/td><td class='n'>114.3<\/td><td>session usage limit<\/td><\/tr><tr><td>D<\/td><td>2026-10-04/05<\/td><td>Claude Opus 5.5<\/td><td class='n'>50<\/td><td class='n'>7,916,874<\/td><td class='n'>107.6<\/td><td>session usage limit<\/td><\/tr><tr><td>D (resumed)<\/td><td>2026-10-05<\/td><td>Claude Opus 5.5<\/td><td class='n'>8<\/td><td class='n'>534,456<\/td><td class='n'>13.4<\/td><td>finished<\/td><\/tr><tr><td>reword 1<\/td><td>2026-10-05<\/td><td>Claude Opus 5.5<\/td><td class='n'>73<\/td><td class='n'>8,132,018<\/td><td class='n'>77.9<\/td><td>session usage limit<\/td><\/tr><tr><td>reword 2<\/td><td>2026-10-05<\/td><td>Claude Opus 5.5<\/td><td class='n'>35<\/td><td class='n'>6,769,022<\/td><td class='n'>71.6<\/td><td>finished<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"note\">37,977,256 agent tokens in total so far (as reported by the workflow tool).<\/p>"}, {"q": "Which licences apply?", "a": "\n<ul><li>SVAMP: MIT. ASDiv: CC BY-NC 4.0. MAWPS (SVAMP repository copy): MIT.<\/li>\n<li>Harvested problems (each record carries its URL and licence): engageny.org 325, im.kendallhunt.com 184, thenational.academy 167, gov.uk 158, ies.ed.gov 28, nationsreportcard.gov 21, tasks.illustrativemathematics.org 19, dera.ioe.ac.uk 15, en.wikibooks.org 1. Licences: CC BY 4.0 (Illustrative\nMathematics), CC BY-NC-SA 3.0/4.0 (EngageNY, IM tasks), Open Government Licence v3.0 (gov.uk, Oak National Academy, dera),\npublic domain (NAEP, IES), CC BY-SA 4.0 (Wikibooks).<\/li>\n<li>Written items, rewordings and code: produced for this thesis by Claude; teacher outputs by Gemma 4 (Gemma terms of use).<\/li><\/ul>"}, {"q": "How can it be reproduced?", "a": "\n<pre>python -m library.domain.math_tutor.benchmarks   # downloads, filters, dedups human sets + harvest -> seeds, test\npython -m library.domain.math_tutor.items        # validates every raw file\npython -m library.domain.math_tutor.prune        # raw + rewordings -> items.jsonl (six stages, splits)\npython -m library.domain.math_tutor.renumber     # items -> renumbered copies\npython -m library.domain.math_tutor.templateness # the templateness table\npython math_tutor_report.py                      # this page<\/pre>\n<ul><li>Everything agent-written is committed as written (<code>items/raw/<\/code>, <code>items/reword/<\/code>,\n<code>benchmarks/harvested/<\/code>); every other file is rebuilt from it deterministically (seed 0).<\/li>\n<li>Agent prompts: <code>writer_brief.md<\/code> plus the run scripts in <code>library/domain/math_tutor/writing_runs/<\/code>, which generated every batch's assignment (the pilot's three assignments are in its README).<\/li><\/ul>"}]};

// ---------- tiny DOM helpers ----------
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key === "html") node.innerHTML = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const fmt = n => (n === null || n === undefined) ? "–" : Number(n).toLocaleString("en-US");
const pct = (a, b) => b ? `${Math.round(100 * a / b)}%` : "–";

function step(num, title, key, ...content) {
  return el("details", { class: "step" },
    el("summary", {}, el("span", { class: "num" }, num), el("span", {}, title), el("span", { class: "key" }, key)),
    el("div", { class: "body" }, ...content));
}
function sub(title, ...content) {
  return el("details", { class: "sub" }, el("summary", {}, title), ...content);
}
function tldr(...lines) { return el("ul", { class: "tldr" }, lines.map(line => el("li", { html: line }))); }
function table(columns, rows) {
  return el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {}, columns.map(c => el("th", { class: c.n ? "n" : "" }, c.label)))),
    el("tbody", {}, rows.map(row => el("tr", {}, columns.map(c => {
      const value = typeof c.get === "function" ? c.get(row) : row[c.get];
      return el("td", { class: c.n ? "n" : "" }, value instanceof Node ? value : (c.n ? fmt(value) : (value ?? "–")));
    }))))));
}
function bars(items, options = {}) {
  const max = options.max || Math.max(1, ...items.map(i => i.value));
  return el("div", { class: "bars" }, items.map(item => {
    const track = el("div", { class: "bar-track" }, el("div", { class: "bar-fill" + (item.alt ? " alt" : ""), style: `width:${100 * item.value / max}%` }));
    if (options.cap) track.append(el("div", { class: "cap-line", style: `left:${100 * options.cap / max}%`, title: `cap ${options.cap}` }));
    return el("div", { class: "bar-row" }, el("span", { class: "label", title: item.label }, item.label), track,
      el("span", { class: "value" }, item.text || fmt(item.value)));
  }));
}
function pre(text) { return el("pre", {}, text); }
function json(value) { return pre(JSON.stringify(value, null, 2)); }
function missing(what) { return el("p", { class: "note" }, `Not built yet: ${what}.`); }

// ---------- similarity, the same algorithm as library/domain/math_tutor/similarity.py ----------
const NUMBER_WORDS = new Set("zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty thirty forty fifty sixty seventy eighty ninety hundred thousand dozen".split(" "));
const NOT_NAMES = new Set("I Mr Mrs Ms Dr Miss Monday Tuesday Wednesday Thursday Friday Saturday Sunday January February March April May June July August September October November December Christmas Halloween Easter Thanksgiving Valentine English American Spanish".split(" "));
function nameWords(texts) {
  const names = new Set();
  for (const text of texts) for (const sentence of text.split(/[.?!]\s+/)) {
    const words = sentence.match(/[A-Za-z]+/g) || [];
    words.slice(1).forEach(w => { if (w[0] === w[0].toUpperCase() && !NOT_NAMES.has(w)) names.add(w); });
  }
  return names;
}
function normaliseText(text, names) {
  const out = [];
  for (const word of text.match(/[A-Za-z]+(?:'[a-z]+)?|\d+(?:[.,]\d+)*/g) || []) {
    if (/^\d/.test(word) || NUMBER_WORDS.has(word.toLowerCase())) { if (out[out.length - 1] !== "N") out.push("N"); }
    else if (names.has(word)) out.push("NAME");
    else out.push(word.toLowerCase());
  }
  return out;
}
// difflib.SequenceMatcher with no junk: repeatedly take the longest common run, recurse on both sides
function matchingBlocks(a, b) {
  const b2j = new Map();
  b.forEach((word, j) => { if (!b2j.has(word)) b2j.set(word, []); b2j.get(word).push(j); });
  const blocks = [], queue = [[0, a.length, 0, b.length]];
  while (queue.length) {
    const [alo, ahi, blo, bhi] = queue.pop();
    let besti = alo, bestj = blo, best = 0, j2len = new Map();
    for (let i = alo; i < ahi; i++) {
      const next = new Map();
      for (const j of b2j.get(a[i]) || []) {
        if (j < blo) continue;
        if (j >= bhi) break;
        const k = (j2len.get(j - 1) || 0) + 1;
        next.set(j, k);
        if (k > best) { besti = i - k + 1; bestj = j - k + 1; best = k; }
      }
      j2len = next;
    }
    if (best) {
      blocks.push([besti, bestj, best]);
      if (alo < besti && blo < bestj) queue.push([alo, besti, blo, bestj]);
      if (besti + best < ahi && bestj + best < bhi) queue.push([besti + best, ahi, bestj + best, bhi]);
    }
  }
  return blocks;
}
function similarityPlayground(original) {
  const left = el("textarea", {}, original);
  const right = el("textarea", {}, "A baker made 48 muffins and sold 21 of them in the evening. How many muffins are left?");
  const out = el("div", {});
  function render() {
    const names = nameWords([left.value, right.value]);
    const a = normaliseText(left.value, names), b = normaliseText(right.value, names);
    const blocks = matchingBlocks(a, b);
    const matched = blocks.reduce((s, blk) => s + blk[2], 0);
    const ratio = (a.length + b.length) ? 2 * matched / (a.length + b.length) : 1;
    const hitA = new Set(), hitB = new Set();
    blocks.forEach(([i, j, k]) => { for (let x = 0; x < k; x++) { hitA.add(i + x); hitB.add(j + x); } });
    const show = (words, hits) => el("div", { class: "tokens" }, words.map((w, i) =>
      el("span", { class: (hits.has(i) ? "hit " : "") + (w === "N" || w === "NAME" ? "ph" : "") }, w)));
    const verdict = ratio > 0.8 ? el("span", { class: "bad" }, "near-duplicate → the later one is dropped") : el("span", { class: "good" }, "different enough → both kept");
    out.replaceChildren(
      el("p", {}, el("span", { class: "score" }, ratio.toFixed(2)), "  ", verdict,
        el("span", { class: "note" }, `  (${matched} words match in order, ${a.length} + ${b.length} words: 2·${matched} / ${a.length + b.length})`)),
      el("p", { class: "note" }, "Normalised, matched runs highlighted:"), show(a, hitA), show(b, hitB));
  }
  left.addEventListener("input", render); right.addEventListener("input", render); render();
  return el("div", {}, el("div", { class: "grid2" }, left, right), out);
}

// ---------- page ----------
function render() {
  const app = document.getElementById("app");
  const human = DATA.human, writing = DATA.writing, pruning = DATA.pruning, renumber = DATA.renumber, storage = DATA.storage;
  const stages = pruning ? pruning.log.stages : [];
  const written = writing.files.reduce((s, f) => s + f.written, 0);
  const valid = writing.files.reduce((s, f) => s + f.valid, 0);
  const kept = pruning ? pruning.log.kept : 0;
  const copies = renumber && renumber.log ? renumber.log.copies : 0;
  const seedsLog = human ? human.log.seeds : null;

  const themeButton = el("button", { class: "theme", onclick: () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  } }, "◐ theme");
  app.append(themeButton, el("h1", {}, "Math tutor — how the data was built"),
    el("p", { class: "sub" }, `Generated ${DATA.generated} from the build logs. Every number below is read from the files, not typed.`));

  app.append(el("div", { class: "chips" },
    [["Human test (SVAMP)", human ? human.log.test.count : null], ["Human seeds", seedsLog ? seedsLog.count : null],
     ["Written by agents", written], ["Pass the validator", valid], ["Kept after pruning", kept],
     ["Renumbered copies", copies], ["Problems for training", kept + copies]].map(([label, value]) =>
      el("div", { class: "chip" }, el("b", {}, fmt(value)), el("span", {}, label)))));

  // the whole funnel at a glance
  if (pruning) {
    const rows = stages.map(s => ({ label: s.stage, value: s.out,
      text: `${fmt(s.out)}${s.in > s.out ? `  (−${fmt(s.in - s.out)})` : ""}` }));
    rows.push({ label: "+ renumbered", value: kept + copies, text: fmt(kept + copies), alt: true });
    const funnel = bars(rows, { max: Math.max(kept + copies, stages.length ? stages[0].in : 1) });
    funnel.classList.add("funnel");
    app.append(el("p", { class: "note" }, "From raw agent output to training problems:"), funnel);
  }

  // 1 spec
  const sliceRows = Object.entries(DATA.slices).map(([id, what]) => ({ id, what }));
  app.append(step("1", "Spec", "one item = word problem + solve() + up to 3 follow-ups",
    tldr("Answer = what <code>solve()</code> returns. Never typed by anyone.",
      "Follow-ups: <code>solve(state)</code> continues from the previous turn's dict.",
      "10 slices = the classic word-problem taxonomy (change, combine, compare, groups, division, rates, multi-step).",
      "Spec file: <code>thesis_work/domain_specs.txt</code>."),
    sub("The 10 slices", table([{ label: "slice", get: "id" }, { label: "what", get: "what" }], sliceRows)),
    storage && storage.example ? sub("A real stored item", json(storage.example)) : null,
    storage && storage.turns.length ? sub("What the teacher and student see, turn by turn",
      ...storage.turns.map((t, i) => el("div", {}, el("span", { class: "tag" }, `turn ${i}`), pre(t)))) : null,
    sub("Teacher prompt (chosen format: working lines)", pre(DATA.prompts.working)),
    sub("Output format examples", pre(DATA.example_responses.slice(1, 4).join("\n\n")))));

  // 2 human sets
  if (human) {
    const sets = Object.entries(human.log.sets).map(([name, s]) => ({ name, ...s,
      role: name === "svamp" ? "test" : "seeds", licence: (human.log.sources[name] || {}).licence || (name === "harvest" ? "per item" : "") }));
    const reasons = [];
    for (const set of sets) for (const [reason, count] of Object.entries(set.dropped_by_reason || {}))
      reasons.push({ label: `${set.name}: ${reason}`, value: count });
    app.append(step("2", "Human problems", `${fmt(human.log.test.count)} test · ${fmt(seedsLog.count)} seeds`,
      tldr("SVAMP = the human test. Never trained on, never shown to a writer.",
        "ASDiv + MAWPS (+ harvested open-licence problems) = seeds the training set grows from.",
        "Range filter: 1–3 operations, whole numbers all the way, numbers ≤ 99, answer ≤ 999, grade ≤ 4.",
        "Each dataset equation → <code>solve()</code>, kept only if it reproduces the dataset's own answer."),
      table([{ label: "set", get: "name" }, { label: "role", get: "role" }, { label: "downloaded", get: "downloaded", n: 1 },
        { label: "in range", get: "in_range", n: 1 }, { label: "kept %", get: r => pct(r.in_range, r.downloaded), n: 1 }, { label: "licence", get: "licence" }], sets),
      sub("Why problems were dropped", bars(reasons.sort((a, b) => b.value - a.value))),
      human.log.sets.harvest ? sub("Harvested (copied word for word from open sources)",
        tldr("Online harvesters replaced the pilot's online writers: real problems, verbatim, with URL and licence; only explicit open licences or public domain; never the 11 sites ASDiv was scraped from."),
        bars(Object.entries(human.log.sets.harvest.by_site || {}).map(([label, value]) => ({ label, value })))) : null,
      sub("Seed dedup", tldr(`${fmt(seedsLog.candidates)} candidates → <b>${fmt(seedsLog.count)}</b> seeds`,
          "Same rules as the synthetic items (step 5). The human sets are partly templated themselves: many MAWPS problems are ASDiv ones with new names and numbers."),
        bars(Object.entries(seedsLog.dropped_by_reason).map(([label, value]) => ({ label, value }))),
        table([{ label: "seed set", get: "set" }, { label: "count", get: "count", n: 1 }],
          Object.entries(seedsLog.by_set).map(([set, count]) => ({ set, count })))),
      sub("Test set shapes (operations in order)", bars(Object.entries(human.log.test.by_shape).map(([label, value]) => ({ label, value })))),
      sub("Examples", human.test_example ? el("div", {}, el("span", { class: "tag" }, "test"), json(human.test_example)) : null,
        ...human.seed_examples.filter(Boolean).map(s => el("div", {}, el("span", { class: "tag" }, `seed · ${s.set}`), json(s)))),
      sub("One dropped example per reason", table([{ label: "reason", get: "reason" }, { label: "set", get: "set" }, { label: "problem", get: "problem" }], human.drop_examples)),
      sub("Licences and citations", table([{ label: "set", get: r => r[0] }, { label: "licence", get: r => r[1].licence }, { label: "citation", get: r => r[1].citation }],
        Object.entries(human.log.sources)))));
  } else app.append(step("2", "Human problems", "", missing("benchmarks")));

  // 3 validator
  app.append(step("3", "Validator", `${DATA.validator_cases.length} broken-on-purpose cases, all caught`,
    tldr("<code>solve()</code> is never run by Python: a 60-line interpreter walks its syntax tree.",
      "Allowed: assignments, + − × // %, whole-number literals, <code>state['x']</code>, one returned dict with <code>'answer'</code>. Everything else is refused, so agent code cannot hang or touch anything.",
      "Every value 0..999, no negatives, // exact (only S07 may leave remainders).",
      "Every number in the code must be in that turn's text (digits, or words like seven / a dozen / twice).",
      "Unused digit numbers must match the distractor label; follow-ups must read state."),
    sub("The cases (python -m library.domain.math_tutor.validator_cases)",
      table([{ label: "case", get: "case" }, { label: "validator says", get: "result" }], DATA.validator_cases))));

  // 4 writing
  const matrix = writing.matrix;
  const bySource = {};
  matrix.forEach(c => { const s = (bySource[c.source] = bySource[c.source] || { written: 0, valid: 0, kept: 0 }); s.written += c.written; s.valid += c.valid; s.kept += c.kept; });
  app.append(step("4", "Writing", `${fmt(written)} items by agents · ${pct(valid, written)} valid`,
    tldr("<b>memory</b>: written from scratch per slice, each batch its own contexts and style emphasis.",
      "<b>seeded</b>: each human seed rewritten into a new story with the same operations.",
      "<b>harvest</b>: real problems copied word for word from openly licensed sources → become seeds.",
      "<b>online</b> (pilot only): retired — the writer found little usable text and credited loosely related pages.",
      "Every writer self-checks with the validator before finishing. Brief: <code>library/domain/math_tutor/writer_brief.md</code>."),
    table([{ label: "source", get: r => r[0] }, { label: "written", get: r => r[1].written, n: 1 }, { label: "valid", get: r => r[1].valid, n: 1 },
      { label: "kept after pruning", get: r => r[1].kept, n: 1 }, { label: "kept %", get: r => pct(r[1].kept, r[1].written), n: 1 }], Object.entries(bySource)),
    sub("Per slice and source", table([{ label: "slice", get: "slice" }, { label: "source", get: "source" }, { label: "written", get: "written", n: 1 },
      { label: "valid", get: "valid", n: 1 }, { label: "kept", get: "kept", n: 1 }], matrix)),
    sub("Raw files", table([{ label: "file", get: "file" }, { label: "written", get: "written", n: 1 }, { label: "valid", get: "valid", n: 1 }], writing.files)),
    writing.writing_log ? sub("Agent runs", json(writing.writing_log)) : null));

  // 5 pruning
  if (pruning) {
    const sim = DATA.similarity;
    const capRows = [];
    app.append(step("5", "Pruning", `${fmt(stages.length ? stages[0].in : 0)} → ${fmt(kept)} kept`,
      el("div", { class: "pipeline" }, stages.map((s, i) => [i ? el("span", { class: "arrow" }, "→") : null,
        el("span", { class: "node", title: JSON.stringify(s.dropped_by_reason) }, `${s.stage} ${fmt(s.out)}`)]).flat()),
      table([{ label: "stage", get: "stage" }, { label: "in", get: "in", n: 1 }, { label: "out", get: "out", n: 1 },
        { label: "dropped because", get: s => Object.entries(s.dropped_by_reason).map(([r, c]) => `${r}: ${c}`).join(" · ") || "–" }], stages),
      sub("1 · execute", tldr("The validator (step 3) on every raw item. Broken JSON counts as a drop too.")),
      sub("2 · normalise", tldr("Lowercase, punctuation out, every number (digits or words) → <b>N</b>, every name → <b>NAME</b>.",
          "Names = words capitalised mid-sentence anywhere in the collection (minus days, months, Mr/Mrs…)."),
        table([{ label: "problem", get: "problem" }, { label: "normalised", get: "normalised" }], stages[1] && stages[1].examples ? stages[1].examples : [])),
      sub("3 · exact", tldr("Same normalised word list as an earlier item → drop. Catches 'same problem, new numbers / names'.")),
      sub("4 · near-dup: word-sequence ratio > 0.8",
        tldr("Ratio = 2 × (words that match in the same order) / (words in both). Same algorithm as Python's difflib.",
          "Drops 80%-the-same-in-order; keeps reorderings and rewordings — they are real variety.",
          "First tried trigram Jaccard > 0.8: it let a one-word swap through (0.68). Switched after the pilot.",
          "Fast and exact at 100k+: each problem is only compared with problems sharing one of its rarest words (prefix filtering); matches brute force on all seeds."),
        table([{ label: "vs: " + sim.original, get: "text" }, { label: "sequence", get: r => el("b", { class: r.sequence > 0.8 ? "bad" : "good" }, r.sequence.toFixed(2)), n: 1 },
          { label: "trigram J", get: "trigram", n: 1 }], sim.rows),
        el("p", { class: "note" }, "Try it — edit either problem:"), similarityPlayground(sim.original)),
      sub("5 · test leak", tldr("Against all 1,000 SVAMP problems: sequence ratio > 0.8 <b>or</b> trigram Jaccard > 0.5 (a shared skeleton is enough).",
        "Online harvesters also avoid the 11 sites ASDiv (and so SVAMP) was scraped from.")),
      sub("6 · shape cap", tldr("Shape = operations in the order computed, follow-ups after |, e.g. <code>mul>sub|add</code>.",
          "Inside each slice no full shape above 25% of the slice; the most redundant (closest neighbour) go first.",
          "Why per slice: S01–S04 all share one-step add/sub — a global cap would have cut most of them (SVAMP is 77% one-step)."),
        ...Object.entries(pruning.shapes_by_slice).map(([slice, shapes]) => {
          const total = shapes.reduce((s, x) => s + x[1], 0);
          const cap = (stages[5] && stages[5].cap_by_slice || {})[slice];
          return el("div", {}, el("span", { class: "tag" }, `${slice} · ${fmt(total)} kept · cap ${fmt(cap)}`),
            bars(shapes.map(([label, value]) => ({ label, value })), { cap, max: Math.max(cap || 0, ...shapes.map(s => s[1])) }));
        })),
      sub("One dropped example per reason", table([{ label: "reason", get: "reason" }, { label: "detail", get: "detail" }, { label: "problem", get: "problem" }], pruning.drop_examples)),
      sub("Splits", tldr("By family: a test item's rewordings and renumberings stay in test. Held-out shapes are chosen after the full run."),
        table([{ label: "split", get: r => r[0] }, { label: "items", get: r => r[1], n: 1 }], Object.entries(pruning.log.by_split)))));
  } else app.append(step("5", "Pruning", "", missing("items/build_log.json")));

  // templateness
  if (DATA.templateness && DATA.templateness.length) {
    const rows = DATA.templateness.map(r => ({ ...r, median_nn: Number(r.median_nn), over: Number(r["nn_over_0.8"]), distinct: Number(r.distinct) }));
    app.append(step("5b", "Templateness", "how alike a problem is to its closest neighbour",
      tldr("Same measure on every set: 2,000-problem sample, normalised, each problem's nearest neighbour by word-sequence ratio.",
        "1.0 = an exact template copy. v1 was built from 260 templates; SVAMP is ten deliberate variations of each of 100 problems."),
      bars(rows.map(r => ({ label: r.set, value: r.median_nn, text: r.median_nn.toFixed(2) })), { max: 1 }),
      table([{ label: "set", get: "set" }, { label: "problems", get: r => Number(r.problems), n: 1 }, { label: "distinct", get: r => r.distinct.toFixed(3), n: 1 },
        { label: "median NN", get: r => r.median_nn.toFixed(3), n: 1 }, { label: "NN > 0.8", get: r => (100 * r.over).toFixed(1) + "%", n: 1 }], rows)));
  }

  // 6 renumber
  if (renumber && renumber.log) {
    app.append(step("6", "Renumber", `${fmt(renumber.log.items)} items → ${fmt(renumber.log.copies)} copies`,
      tldr("Same words, new numbers: each number the code uses (and each digit distractor) gets a value between half and double the old one.",
        "Text and code change together in every turn; <code>solve()</code> is re-run; the copy is kept only if it passes the full validator.",
        "Implied numbers (twice, a week) stay fixed. Copies keep the family and split."),
      table([{ label: "outcome", get: r => r[0] }, { label: "items", get: r => r[1], n: 1 }], Object.entries(renumber.log.outcomes)),
      renumber.original ? sub("An item and its copies",
        el("div", {}, el("span", { class: "tag" }, "original"), pre([renumber.original.problem, ...renumber.original.follow_ups.map(f => "  → " + f.question)].join("\n") + `\nanswers ${JSON.stringify(renumber.original.answers)}`)),
        ...renumber.copies.map((c, i) => el("div", {}, el("span", { class: "tag" }, `copy ${i + 1}`),
          pre([c.problem, ...c.follow_ups.map(f => "  → " + f.question)].join("\n") + `\nanswers ${JSON.stringify(c.answers)}`)))) : null));
  }

  // 7 storage
  app.append(step("7", "Storage", "where everything lives",
    tldr("<code>items/raw/</code>: what agents wrote — appended, never rewritten by the pipeline.",
      "Everything else under <code>items/</code> and <code>benchmarks/</code> is rebuilt by a zero-argument command.",
      "<code>corpus.jsonl</code> (gitignored): one line per turn, train first, test last."),
    table([{ label: "file", get: "path" }, { label: "KB", get: "kb", n: 1 }, { label: "lines", get: "lines", n: 1 }], storage.files),
    pre("python -m library.domain.math_tutor.benchmarks   # human sets -> benchmarks/\npython -m library.domain.math_tutor.prune        # raw -> items.jsonl, dropped.jsonl, build_log.json\npython -m library.domain.math_tutor.renumber     # items -> renumbered.jsonl\npython -m library.domain.math_tutor.items        # validate raw files\npython math_tutor_report.py                      # this page")));

  // a real conversation through the teacher
  if (DATA.conversation && DATA.conversation.length) {
    app.append(step("C", "A conversation", "one item, its rewording and a renumbered copy, every turn through Gemma 4",
      tldr("Each turn: what the student sees (earlier turns carry the correct answers the harness holds), what Gemma writes, and the executed answer.",
        "Wrong teacher turns are kept and flagged <code>answer_correct: false</code>."),
      ...DATA.conversation.map(conversation => sub(`${conversation.id} · ${conversation.source}`,
        ...conversation.turns.map((turn, index) => el("div", {},
          el("span", { class: "tag" }, `turn ${index}`),
          el("span", { class: turn.teacher_correct ? "good" : "bad" }, turn.teacher_correct ? " teacher correct" : ` teacher wrong (answer ${turn.executed_answer})`),
          el("div", { class: "grid2" }, pre(turn.student_sees.trim()), pre(turn.teacher_writes))))))));
  }

  // methods: the exact process, question by question, for the thesis
  if (DATA.methods && DATA.methods.length) {
    app.append(el("h2", { style: "margin-top:32px" }, "Methods — how the corpus was made (Q&A)"),
      el("p", { class: "note" }, "The exact process in the order it was done, for the thesis methods chapter. Numbers come from the build logs."),
      ...DATA.methods.map((entry, index) => el("details", { class: "step" },
        el("summary", {}, el("span", { class: "num" }, `Q${index + 1}`), el("span", {}, entry.q)),
        el("div", { class: "body", html: entry.a }))));
  }

  // 8 teacher
  if (DATA.teacher) {
    app.append(step("8", "Teacher check", DATA.teacher.headline || "",
      tldr(...(DATA.teacher.tldr || [])),
      ...(DATA.teacher.tables || []).map(t => sub(t.title, table(t.columns.map(c => ({ label: c, get: c, n: typeof t.rows[0][c] === "number" })), t.rows)))));
  }
}
render();
</script>
</body>
</html>
