<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Newsletter | Ashford Museum</title>
</head>
<body>
<nav id="site-nav">
  <a href="index.html">Home</a> <a href="exhibitions.html">Exhibitions</a>
  <a href="tickets.html">Tickets</a> <a href="visit.html">Visit</a>
</nav>
<main>
  <section id="newsletter-intro">
    <h1>Newsletter</h1>
    <p>One email a month about new exhibitions and events.</p>
    <p>Members hear about previews first.</p>
  </section>

  <form id="signup-form" action="thanks.html" method="post">
    <label for="signup-email">Email</label>
    <input type="email" id="signup-email" name="email" required>
    <label for="signup-interest">Interested in</label>
    <select id="signup-interest" name="interest">
      <option>Exhibitions</option>
      <option>Family events</option>
      <option>Talks</option>
    </select>
    <button type="submit">Sign up</button>
  </form>

  <section id="privacy-note">
    <h2>Your data</h2>
    <p>We never share your email. Unsubscribe with one click.</p>
  </section>
</main>
<footer id="page-footer">Ashford Museum, 2 Castle Street</footer>
</body>
</html>
