<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Private dining | Copper Pot</title>
</head>
<body>
<nav id="site-nav">
  <a href="index.html">Home</a> <a href="menu.html">Menu</a>
  <a href="booking.html">Book a table</a> <a href="contact.html">Contact</a>
</nav>
<main>
  <section id="private-rooms">
    <h1>Private dining</h1>
    <table id="room-table">
      <tr><th>Room</th><th>Seats</th><th>Minimum spend</th></tr>
      <tr><td>The Forge</td><td>12</td><td>$600</td></tr>
      <tr><td>Garden room</td><td>24</td><td>$1,200</td></tr>
      <tr><td>Whole restaurant</td><td>40</td><td>$3,000</td></tr>
    </table>
  </section>

  <section id="group-menus">
    <h2>Group menus</h2>
    <p>Groups choose one set menu: $45 or $60 a head.</p>
    <p>A 12.5% service charge is added to the bill.</p>
  </section>

  <form id="enquiry-form" action="thanks.html" method="post">
    <label for="enquiry-email">Email</label>
    <input type="email" id="enquiry-email" name="email" required>
    <label for="enquiry-date">Date</label>
    <input type="date" id="enquiry-date" name="date">
    <label for="enquiry-guests">Guests</label>
    <input type="number" id="enquiry-guests" name="guests" min="9">
    <button type="submit">Send enquiry</button>
  </form>
</main>
<footer id="page-footer">Copper Pot, 14 Mill Lane, Riverside</footer>
</body>
</html>
