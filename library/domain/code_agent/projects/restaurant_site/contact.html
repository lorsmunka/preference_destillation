<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact | Copper Pot</title>
</head>
<body>
<nav id="site-nav">
  <a href="index.html">Home</a> <a href="menu.html">Menu</a>
  <a href="booking.html">Book a table</a> <a href="contact.html">Contact</a>
</nav>
<main>
  <section id="opening-hours">
    <h1>Opening hours</h1>
    <table id="hours-table">
      <tr><td>Monday</td><td>Closed</td></tr>
      <tr><td>Tuesday to Friday</td><td>12:00-15:00, 18:00-22:00</td></tr>
      <tr><td>Saturday</td><td>12:00-23:00</td></tr>
      <tr><td>Sunday</td><td>12:00-18:00</td></tr>
    </table>
  </section>

  <section id="find-us">
    <h2>Find us</h2>
    <p>14 Mill Lane, Riverside, by the old bridge.</p>
    <p>Bus 7 stops outside. Parking on Mill Street, $2 an hour.</p>
  </section>

  <form id="contact-form" action="thanks.html" method="post">
    <label for="contact-email">Your email</label>
    <input type="email" id="contact-email" name="email" required>
    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" required></textarea>
    <button type="submit">Send</button>
  </form>
</main>
<footer id="page-footer">Copper Pot, 14 Mill Lane, Riverside</footer>
</body>
</html>
