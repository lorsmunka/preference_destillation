<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact | Northstar Travel</title>
</head>
<body>
<nav id="site-nav">
  <a href="index.html">Home</a> <a href="tours.html">Tours</a>
  <a href="booking.html">Book</a> <a href="contact.html">Contact</a>
</nav>
<main>
  <section id="office">
    <h1>Contact us</h1>
    <p>8 Bridge Street, Elmford, above the bakery.</p>
    <p>Phone 555 0150, Monday to Friday 9:00 to 17:30.</p>
  </section>

  <section id="emergency-line">
    <h2>During your tour</h2>
    <p>Call 555 0159 at any time, day or night.</p>
  </section>

  <form id="contact-form" action="thanks.html" method="post">
    <label for="contact-name">Name</label>
    <input type="text" id="contact-name" name="name" required>
    <label for="contact-email">Email</label>
    <input type="email" id="contact-email" name="email" required>
    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" required></textarea>
    <button type="submit">Send</button>
  </form>
</main>
<footer id="page-footer">Northstar Travel, 8 Bridge Street, Elmford</footer>
</body>
</html>
